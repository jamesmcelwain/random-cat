<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultimate MD Viewer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ════════════════════════════════════════════
       THEME TOKENS
    ════════════════════════════════════════════ */
    :root {
      --radius: 8px;
    }

    /* Light theme values (shared) */
    [data-theme="light"] {
      --bg:            #f8f9fa;
      --surface:       #ffffff;
      --surface2:      #f1f3f5;
      --border:        #dee2e6;
      --border2:       #ced4da;
      --text:          #212529;
      --text-dim:      #6c757d;
      --heading:       #111827;
      --accent:        #2563eb;
      --accent-hover:  #1d4ed8;
      --code-bg:       #f1f3f5;
      --code-text:     #d63384;
      --pre-bg:        #f8f9fa;
      --pre-text:      #212529;
      --pre-border:    #dee2e6;
      --bq-border:     #2563eb;
      --bq-bg:         #eff6ff;
      --th-bg:         #f1f3f5;
      --th-text:       #374151;
      --td-stripe:     #f8f9fa;
      --hr:            #dee2e6;
      --shadow-card:   0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
      --header-bg:     #ffffff;
      --header-border: #dee2e6;
      --header-text:   #111827;
      --btn-bg:        #2563eb;
      --btn-text:      #ffffff;
      --btn-hover:     #1d4ed8;
      --toggle-bg:     #e9ecef;
      --toggle-active: #2563eb;
      --toggle-text:   #495057;
      --toggle-active-text: #ffffff;
      --picker-bg:     #f8f9fa;
      --drop-bg:       #ffffff;
      --drop-border:   #dee2e6;
      --drop-hover:    #eff6ff;
      --drop-label:    #2563eb;
      --logo-color:    #2563eb;
      --filename-color:#6c757d;
      --link:          #2563eb;
    }

    /* Dark theme values (shared) */
    [data-theme="dark"] {
      --bg:            #0f1117;
      --surface:       #1a1d27;
      --surface2:      #22263a;
      --border:        #2e3347;
      --border2:       #3a4060;
      --text:          #c9d1e0;
      --text-dim:      #6b7694;
      --heading:       #e8edf5;
      --accent:        #5b8af5;
      --accent-hover:  #7aa3ff;
      --code-bg:       #0f1117;
      --code-text:     #f472b6;
      --pre-bg:        #0a0c13;
      --pre-text:      #c9d1e0;
      --pre-border:    #2e3347;
      --bq-border:     #5b8af5;
      --bq-bg:         rgba(91,138,245,.08);
      --th-bg:         #22263a;
      --th-text:       #e8edf5;
      --td-stripe:     rgba(255,255,255,.02);
      --hr:            #2e3347;
      --shadow-card:   0 1px 3px rgba(0,0,0,.4), 0 4px 24px rgba(0,0,0,.35);
      --header-bg:     #1a1d27;
      --header-border: #2e3347;
      --header-text:   #e8edf5;
      --btn-bg:        #5b8af5;
      --btn-text:      #ffffff;
      --btn-hover:     #7aa3ff;
      --toggle-bg:     #22263a;
      --toggle-active: #5b8af5;
      --toggle-text:   #6b7694;
      --toggle-active-text: #ffffff;
      --picker-bg:     #0f1117;
      --drop-bg:       #1a1d27;
      --drop-border:   #2e3347;
      --drop-hover:    rgba(91,138,245,.08);
      --drop-label:    #5b8af5;
      --logo-color:    #5b8af5;
      --filename-color:#6b7694;
      --link:          #5b8af5;
    }

    /* System — follow OS preference */
    [data-theme="system"] { color-scheme: light dark; }
    @media (prefers-color-scheme: light) {
      [data-theme="system"] {
        --bg:#f8f9fa; --surface:#ffffff; --surface2:#f1f3f5; --border:#dee2e6; --border2:#ced4da;
        --text:#212529; --text-dim:#6c757d; --heading:#111827; --accent:#2563eb; --accent-hover:#1d4ed8;
        --code-bg:#f1f3f5; --code-text:#d63384; --pre-bg:#f8f9fa; --pre-text:#212529; --pre-border:#dee2e6;
        --bq-border:#2563eb; --bq-bg:#eff6ff; --th-bg:#f1f3f5; --th-text:#374151; --td-stripe:#f8f9fa; --hr:#dee2e6;
        --shadow-card:0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
        --header-bg:#ffffff; --header-border:#dee2e6; --header-text:#111827;
        --btn-bg:#2563eb; --btn-text:#ffffff; --btn-hover:#1d4ed8;
        --toggle-bg:#e9ecef; --toggle-active:#2563eb; --toggle-text:#495057; --toggle-active-text:#ffffff;
        --picker-bg:#f8f9fa; --drop-bg:#ffffff; --drop-border:#dee2e6; --drop-hover:#eff6ff; --drop-label:#2563eb;
        --logo-color:#2563eb; --filename-color:#6c757d; --link:#2563eb;
      }
    }
    @media (prefers-color-scheme: dark) {
      [data-theme="system"] {
        --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3347; --border2:#3a4060;
        --text:#c9d1e0; --text-dim:#6b7694; --heading:#e8edf5; --accent:#5b8af5; --accent-hover:#7aa3ff;
        --code-bg:#0f1117; --code-text:#f472b6; --pre-bg:#0a0c13; --pre-text:#c9d1e0; --pre-border:#2e3347;
        --bq-border:#5b8af5; --bq-bg:rgba(91,138,245,.08); --th-bg:#22263a; --th-text:#e8edf5; --td-stripe:rgba(255,255,255,.02); --hr:#2e3347;
        --shadow-card:0 1px 3px rgba(0,0,0,.4), 0 4px 24px rgba(0,0,0,.35);
        --header-bg:#1a1d27; --header-border:#2e3347; --header-text:#e8edf5;
        --btn-bg:#5b8af5; --btn-text:#ffffff; --btn-hover:#7aa3ff;
        --toggle-bg:#22263a; --toggle-active:#5b8af5; --toggle-text:#6b7694; --toggle-active-text:#ffffff;
        --picker-bg:#0f1117; --drop-bg:#1a1d27; --drop-border:#2e3347; --drop-hover:rgba(91,138,245,.08); --drop-label:#5b8af5;
        --logo-color:#5b8af5; --filename-color:#6b7694; --link:#5b8af5;
      }
    }

    /* ════════════════════════════════════════════
       BASE
    ════════════════════════════════════════════ */
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background .2s, color .2s;
    }

    /* ── HEADER ── */
    header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--header-border);
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 60px;
      position: sticky;
      top: 0;
      z-index: 20;
      transition: background .2s, border-color .2s;
    }

    .logo-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; text-decoration: none; }
    .logo-splat { width: 40px; height: auto; flex-shrink: 0; display: block; }
    .logo-text {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--heading);
      line-height: 1.2;
      letter-spacing: -.02em;
    }

    .header-filename {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      color: var(--filename-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── BACK BUTTON ── */
    .back-btn {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid transparent;
      width: 34px;
      height: 30px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      cursor: pointer;
      transition: background .15s;
      flex-shrink: 0;
      font-family: inherit;
    }
    .back-btn:hover { background: var(--btn-hover); }

    /* ── PICKER ── */
    #picker {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 40px 20px;
      background: var(--picker-bg);
      transition: background .2s;
    }
    .picker-title-pro {
      font-size: clamp(28px, 5vw, 46px);
      font-weight: 700;
      color: var(--heading);
      letter-spacing: -.03em;
      text-align: center;
      line-height: 1.1;
    }
    .picker-title-pro span { color: var(--accent); }
    .picker-sub {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-dim);
      text-align: center;
      max-width: 360px;
    }
    .picker-credit {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      opacity: .7;
      text-align: center;
    }
    .picker-credit strong { color: var(--accent); font-weight: 700; }
    .picker-credit a { text-decoration: none; }
    .picker-credit a:hover strong { text-decoration: underline; text-underline-offset: 2px; }

    /* ── DROP ZONE ── */
    .drop-zone-wrap { width: min(420px, 92vw); position: relative; }
    .drop-zone-pro {
      background: var(--drop-bg);
      border: 2px dashed var(--drop-border);
      border-radius: 12px;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 40px 28px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .drop-zone-pro:hover, .drop-zone-pro.dragover {
      border-color: var(--accent);
      background: var(--drop-hover);
    }
    .drop-zone-pro .dz-icon { font-size: 40px; opacity: .5; }
    .drop-zone-pro .dz-label { font-size: 15px; font-weight: 600; color: var(--drop-label); }
    .drop-zone-pro .dz-hint { font-size: 12px; color: var(--text-dim); }

    /* ── FILE TAB BAR ── */
    #tab-bar-wrap {
      display: none;
      position: sticky;
      top: 60px;
      z-index: 15;
      flex-direction: column;
    }
    #tab-bar-wrap.visible { display: flex; }

    #tab-bar {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 0 0 0 12px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
      min-height: 38px;
      flex-shrink: 0;
      transition: min-height .2s, padding .2s, border-color .2s;
    }
    #tab-bar::-webkit-scrollbar { height: 3px; }
    #tab-bar::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* Highlight when dragging files onto the bar */
    #tab-bar.file-dragover {
      background: var(--drop-hover);
      box-shadow: inset 0 0 0 2px var(--accent);
    }
    #tab-collapsed-strip.file-dragover {
      background: var(--drop-hover);
      box-shadow: inset 0 0 0 2px var(--accent);
    }

    #tab-bar-wrap.collapsed #tab-bar {
      min-height: 0; height: 0; overflow: hidden; border-bottom: none; padding: 0;
    }
    #tab-bar-wrap.collapsed #tab-collapsed-strip { display: flex; }

    #tab-collapsed-strip {
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      height: 14px;
      cursor: pointer;
      transition: background .15s;
      gap: 6px;
    }
    #tab-collapsed-strip:hover { background: var(--surface); }
    #tab-collapsed-strip span {
      font-size: 10px; font-weight: 600; color: var(--text-dim);
      letter-spacing: .06em; text-transform: uppercase; line-height: 1; user-select: none;
    }
    #tab-collapsed-strip svg { opacity: .45; }

    .tab-collapse-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-dim);
      padding: 0 10px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color .15s, background .15s;
      border-radius: 4px;
      margin-left: auto;
    }
    .tab-collapse-btn:hover { color: var(--text); background: var(--surface); }

    .file-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      height: 38px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      border-right: 1px solid var(--border);
      cursor: pointer;
      white-space: nowrap;
      max-width: 180px;
      transition: background .15s, color .15s;
      flex-shrink: 0;
      user-select: none;
    }
    .file-tab:hover { background: var(--surface); color: var(--text); }
    .file-tab.active {
      background: var(--surface);
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
    }
    .file-tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px; }
    .file-tab-close {
      flex-shrink: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: inherit;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
      border-radius: 3px;
      opacity: .5;
      transition: opacity .15s, background .15s;
    }
    .file-tab-close:hover { opacity: 1; background: rgba(128,128,128,.2); }

    .tab-add-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 18px;
      font-weight: 300;
      padding: 0 10px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color .15s, background .15s;
      border-radius: 4px;
      margin-left: 4px;
    }
    .tab-add-btn:hover { color: var(--accent); background: var(--surface); }

    .file-tab[draggable="true"] { cursor: grab; }
    .file-tab[draggable="true"]:active { cursor: grabbing; }
    .file-tab.drag-over { border-left: 2px solid var(--accent); background: var(--drop-hover); }
    .file-tab.dragging { opacity: .35; }

    #file-input { display: none; }

    /* ── VIEWER ── */
    #viewer { display: none; flex: 1; padding: 40px 20px 60px; justify-content: center; background: var(--bg); transition: background .2s; }
    #viewer.active { display: flex; }
    .viewer-inner {
      width: 100%;
      max-width: 95%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 56px;
      box-shadow: var(--shadow-card);
      transition: background .2s, border-color .2s, box-shadow .2s, max-width .15s;
    }

    /* ── PROSE ── */
    .prose { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; line-height: 1.75; color: var(--text); }
    .prose h1,.prose h2,.prose h3,.prose h4,.prose h5,.prose h6 {
      font-weight: 700; color: var(--heading); line-height: 1.25;
      margin-top: 2em; margin-bottom: .5em; letter-spacing: -.02em;
    }
    .prose h1 { font-size: 2em; margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: .4em; }
    .prose h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: .25em; }
    .prose h3 { font-size: 1.2em; }
    .prose h4 { font-size: 1em; }
    .prose p { margin-bottom: 1.1em; }
    .prose a { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
    .prose a:hover { opacity: .8; }
    .prose strong { color: var(--heading); font-weight: 700; }
    .prose em { font-style: italic; }
    .prose del { opacity: .6; }
    .prose ul,.prose ol { padding-left: 1.6em; margin-bottom: 1.1em; }
    .prose li { margin-bottom: .35em; }
    .prose blockquote {
      border-left: 3px solid var(--bq-border);
      background: var(--bq-bg);
      margin: 1.5em 0;
      padding: .6em 1.2em;
      color: var(--text-dim);
      font-style: italic;
      border-radius: 0 6px 6px 0;
    }
    .prose code {
      font-family: 'Courier New', monospace;
      font-size: .85em;
      background: var(--code-bg);
      color: var(--code-text);
      padding: .15em .4em;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .prose pre {
      background: var(--pre-bg);
      border: 1px solid var(--pre-border);
      border-radius: 8px;
      padding: 1.2em 1.4em;
      overflow-x: auto;
      margin-bottom: 1.3em;
    }
    .prose pre code { background: none; border: none; padding: 0; color: var(--pre-text); font-size: .85em; }
    .prose table {
      border-collapse: collapse; width: 100%; margin-bottom: 1.3em; font-size: .9em;
      border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    }
    .prose th {
      background: var(--th-bg); color: var(--th-text); font-weight: 600;
      padding: .6em 1em; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); text-align: left;
    }
    .prose th:last-child { border-right: none; }
    .prose td { padding: .55em 1em; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
    .prose td:last-child { border-right: none; }
    .prose tr:nth-child(even) td { background: var(--td-stripe); }
    .prose tr:last-child td { border-bottom: none; }
    .prose hr { border: none; border-top: 1px solid var(--hr); margin: 2em 0; }
    .prose img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); margin: .5em 0; }
    .prose input[type="checkbox"] { margin-right: .5em; accent-color: var(--accent); }

    /* ── TELEPROMPTER TOOLBAR ── */
    #teleprompter-bar {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 10px 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,.18);
      align-items: center;
      justify-content: center;
      gap: 10px 14px;
      flex-wrap: wrap;
      max-width: calc(100vw - 24px);
      transition: background .2s, border-color .2s;
    }
    #teleprompter-bar.visible { display: flex; }

    /* Each control keeps its label + slider + value together so they wrap as a unit */
    .tp-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 1;
      min-width: 0;
    }

    .tp-btn {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .15s, transform .1s;
    }
    .tp-btn:hover { background: var(--btn-hover); transform: scale(1.1); }

    .tp-label { font-size: 12px; font-weight: 600; color: var(--text-dim); flex-shrink: 0; }

    .tp-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 110px;
      max-width: 30vw;
      min-width: 60px;
      height: 4px;
      border-radius: 2px;
      background: var(--border2);
      outline: none;
      cursor: pointer;
      flex-shrink: 1;
    }
    .tp-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--surface);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .tp-speed-val { font-size: 12px; font-weight: 700; color: var(--accent); min-width: 28px; text-align: right; }

    .tp-reset {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 14px;
      padding: 4px;
      border-radius: 4px;
      transition: color .15s;
      flex-shrink: 0;
    }
    .tp-reset:hover { color: var(--accent); }

    .tp-divider { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }

    /* Header settings / play buttons */
    .tp-toggle-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 15px;
      font-weight: 600;
      padding: 0;
      width: 34px;
      height: 30px;
      border-radius: 6px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: border-color .15s, color .15s, background .15s;
      flex-shrink: 0;
      white-space: nowrap;
      font-family: inherit;
    }
    .tp-toggle-btn.visible { display: flex; }
    .tp-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tp-toggle-btn.tp-on { background: var(--accent); color: #fff; border-color: var(--accent); }

    @media (max-width: 600px) {
      .viewer-inner { padding: 24px 20px; }
      .prose { font-size: 15px; }
      #teleprompter-bar { padding: 10px 14px; gap: 8px 10px; bottom: 16px; border-radius: 18px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <!-- Official Markdown mark -->
    <svg class="logo-splat" viewBox="0 0 208 128" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Markdown">
      <rect x="5" y="5" width="198" height="118" rx="14" fill="none" stroke="var(--logo-color)" stroke-width="10"/>
      <path fill="var(--logo-color)" d="M30 98V30h20l20 25 20-25h20v68H90V59L70 84 50 59v39H30zm125 0l-30-33h20V30h20v35h20l-30 33z"/>
    </svg>
    <span class="logo-text">Ultimate MD Viewer</span>
  </div>

  <span class="header-filename" id="header-filename"></span>

  <!-- Play/Pause (scroll) — appears with a file -->
  <button class="tp-toggle-btn" id="tp-header-play-btn" onclick="togglePlay()" title="Play / Pause scroll" style="display:none">
    <span id="tp-header-play-icon">▶</span>
  </button>

  <!-- Single theme toggle: shows the theme you'd switch TO -->
  <button class="tp-toggle-btn visible" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle light / dark">
    <span id="theme-toggle-icon"></span>
  </button>

  <!-- Settings (teleprompter controls) -->
  <button class="tp-toggle-btn" id="tp-toggle-btn" onclick="toggleTeleprompter()" title="Settings">
    <span>⚙️</span>
  </button>

  <!-- Back to picker -->
  <button class="back-btn" id="back-btn" style="display:none" onclick="goBack()" title="Back to files" aria-label="Back">
    <svg viewBox="0 0 20 20" width="17" height="17" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12.5 15l-5-5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</header>

<!-- File tab bar -->
<div id="tab-bar-wrap">
  <div id="tab-bar"></div>
  <div id="tab-collapsed-strip" onclick="toggleTabBar()">
    <svg width="12" height="6" viewBox="0 0 12 6" fill="none"><path d="M1 1l5 4 5-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Files</span>
    <svg width="12" height="6" viewBox="0 0 12 6" fill="none"><path d="M1 1l5 4 5-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</div>

<!-- Teleprompter floating bar -->
<div id="teleprompter-bar">
  <div class="tp-group">
    <button class="tp-btn" id="tp-play-btn" onclick="togglePlay()" title="Play / Pause">▶</button>
    <span class="tp-label">Speed</span>
    <input class="tp-slider" id="tp-slider" type="range" min="1" max="10" value="3" oninput="onSpeedChange(this.value)">
    <span class="tp-speed-val" id="tp-speed-val">3</span>
    <button class="tp-reset" onclick="resetScroll()" title="Reset to top">↑ Reset</button>
  </div>
  <div class="tp-divider"></div>
  <div class="tp-group">
    <span class="tp-label">Size</span>
    <input class="tp-slider" id="tp-size-slider" type="range" min="12" max="50" value="16" oninput="onSizeChange(this.value)">
    <span class="tp-speed-val" id="tp-size-val">16px</span>
  </div>
  <div class="tp-divider"></div>
  <div class="tp-group">
    <span class="tp-label">Width</span>
    <input class="tp-slider" id="tp-width-slider" type="range" min="20" max="100" value="95" oninput="onWidthChange(this.value)">
    <span class="tp-speed-val" id="tp-width-val">95%</span>
  </div>
</div>

<section id="picker">
  <h1 class="picker-title-pro">Ultimate <span>MD Viewer</span></h1>
  <p class="picker-sub" id="picker-sub">Open any .md file to read it as formatted text.</p>

  <div class="drop-zone-wrap">
    <!-- Professional drop zone -->
    <div class="drop-zone-pro" id="drop-zone-pro" onclick="document.getElementById('file-input').click()">
      <div class="dz-icon">📄</div>
      <div class="dz-label">Click to browse or drag files here</div>
      <div class="dz-hint">Select or drop one or more .md / .markdown files</div>
    </div>

  </div>

  <input type="file" id="file-input" accept=".md,.markdown" multiple />

  <footer class="picker-credit">Created by <a href="https://github.com/jamesmcelwain" target="_blank" rel="noopener"><strong>Jim McElwain</strong></a></footer>
</section>

<section id="viewer">
  <div class="viewer-inner">
    <div class="prose" id="prose-output"></div>
  </div>
</section>

<script>
  // ── Theme management ────────────────────────────────────────────────────
  const STORAGE_KEY = 'mdviewer-theme';

  // Icons: the button shows the theme you'll switch TO.
  const THEME_ICON = { light: '☀️', dark: '🌙' };

  function applyTheme(mode) {
    document.documentElement.setAttribute('data-theme', mode);
    localStorage.setItem(STORAGE_KEY, mode);
    // Show the icon of the *other* theme (what a click switches to)
    const next = mode === 'dark' ? 'light' : 'dark';
    const icon = document.getElementById('theme-toggle-icon');
    icon.textContent = THEME_ICON[next];
    document.getElementById('theme-toggle-btn').title =
      'Switch to ' + next + ' mode';
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  }

  (function initTheme() {
    let saved = localStorage.getItem(STORAGE_KEY);
    if (saved !== 'light' && saved !== 'dark') {
      // First visit — follow the OS preference
      saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    applyTheme(saved);
  })();

  // ── Markdown parser ──────────────────────────────────────────────────────
  function parseMarkdown(md) {
    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    const codeBlocks = [];
    md = md.replace(/```([\w-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      const i = codeBlocks.length;
      codeBlocks.push(`<pre><code class="language-${escHtml(lang)}">${escHtml(code.replace(/\n$/, ''))}</code></pre>`);
      return `\x00CODE${i}\x00`;
    });
    const inlineCodes = [];
    md = md.replace(/`([^`]+)`/g, (_, code) => {
      const i = inlineCodes.length;
      inlineCodes.push(`<code>${escHtml(code)}</code>`);
      return `\x00INLINE${i}\x00`;
    });

    const lines = md.split('\n');
    let html = '';
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];

      const hm = line.match(/^(#{1,6})\s+(.*)/);
      if (hm) { html += `<h${hm[1].length}>${inlineFormat(hm[2])}</h${hm[1].length}>\n`; i++; continue; }

      if (/^[-*_]{3,}\s*$/.test(line)) { html += '<hr>\n'; i++; continue; }

      if (line.startsWith('> ')) {
        let bq = '';
        while (i < lines.length && lines[i].startsWith('> ')) { bq += lines[i].slice(2) + '\n'; i++; }
        html += `<blockquote>${inlineFormat(bq.trim())}</blockquote>\n`;
        continue;
      }

      if (line.startsWith('\x00CODE')) { html += line.trim() + '\n'; i++; continue; }

      if (/^[-*+] /.test(line)) {
        html += '<ul>\n';
        while (i < lines.length && /^[-*+] /.test(lines[i])) {
          const item = lines[i].replace(/^[-*+] /, '');
          const task = item.match(/^\[( |x)\] (.*)/i);
          if (task) {
            html += `<li><input type="checkbox" ${task[1].toLowerCase()==='x'?'checked':''} disabled> ${inlineFormat(task[2])}</li>\n`;
          } else {
            html += `<li>${inlineFormat(item)}</li>\n`;
          }
          i++;
        }
        html += '</ul>\n'; continue;
      }

      if (/^\d+\. /.test(line)) {
        html += '<ol>\n';
        while (i < lines.length && /^\d+\. /.test(lines[i])) {
          html += `<li>${inlineFormat(lines[i].replace(/^\d+\. /,''))}</li>\n`; i++;
        }
        html += '</ol>\n'; continue;
      }

      if (line.includes('|') && i+1 < lines.length && /^\|?[\s:|-]+\|/.test(lines[i+1])) {
        const parseRow = r => r.split('|').map(c=>c.trim()).filter((_,idx,arr)=>!(idx===0&&arr[0]==='')&&!(idx===arr.length-1&&arr[arr.length-1]===''));
        const headers = parseRow(line); i += 2;
        html += '<table>\n<thead><tr>'+headers.map(h=>`<th>${inlineFormat(h)}</th>`).join('')+'</tr></thead>\n<tbody>\n';
        while (i < lines.length && lines[i].includes('|')) {
          html += '<tr>'+parseRow(lines[i]).map(c=>`<td>${inlineFormat(c)}</td>`).join('')+'</tr>\n'; i++;
        }
        html += '</tbody></table>\n'; continue;
      }

      if (line.trim() === '') { i++; continue; }

      let para = '';
      while (i < lines.length && lines[i].trim() !== '' && !/^#{1,6} /.test(lines[i]) && !/^[-*+] /.test(lines[i]) && !/^\d+\. /.test(lines[i]) && !/^[-*_]{3,}\s*$/.test(lines[i]) && !lines[i].startsWith('> ') && !lines[i].startsWith('\x00CODE')) {
        para += (para?' ':'')+lines[i].trim(); i++;
      }
      if (para) html += `<p>${inlineFormat(para)}</p>\n`;
    }

    codeBlocks.forEach((cb,idx) => { html = html.replace(`\x00CODE${idx}\x00`, cb); });
    inlineCodes.forEach((ic,idx) => { html = html.replace(`\x00INLINE${idx}\x00`, ic); });
    return html;
  }

  function inlineFormat(s) {
    return s
      .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/___(.+?)___/g,'<strong><em>$1</em></strong>')
      .replace(/__(.+?)__/g,'<strong>$1</strong>')
      .replace(/_(.+?)_/g,'<em>$1</em>')
      .replace(/~~(.+?)~~/g,'<del>$1</del>')
      .replace(/\n/g,'<br>');
  }

  // ── Teleprompter ──────────────────────────────────────────────────────────
  let tpActive = false;   // bar visible
  let tpPlaying = false;
  let tpRaf = null;
  let tpSpeed = 3;        // 1–10

  function pxPerFrame() {
    // speed 1 = ~0.4px/frame, speed 10 = ~4px/frame at 60fps
    return tpSpeed * 0.4;
  }

  function toggleTeleprompter() {
    tpActive = !tpActive;
    const bar = document.getElementById('teleprompter-bar');
    const btn = document.getElementById('tp-toggle-btn');
    bar.classList.toggle('visible', tpActive);
    btn.classList.toggle('tp-on', tpActive);
    if (!tpActive) stopScroll();
  }

  function togglePlay() {
    tpPlaying ? stopScroll() : startScroll();
  }

  function startScroll() {
    tpPlaying = true;
    document.getElementById('tp-play-btn').textContent = '⏸';
    document.getElementById('tp-header-play-icon').textContent = '⏸';
    document.getElementById('tp-header-play-btn').classList.add('tp-on');
    function step() {
      const maxY = document.documentElement.scrollHeight - window.innerHeight;
      if (window.scrollY >= maxY) { stopScroll(); return; }
      window.scrollBy(0, pxPerFrame());
      tpRaf = requestAnimationFrame(step);
    }
    tpRaf = requestAnimationFrame(step);
  }

  function stopScroll() {
    tpPlaying = false;
    document.getElementById('tp-play-btn').textContent = '▶';
    document.getElementById('tp-header-play-icon').textContent = '▶';
    document.getElementById('tp-header-play-btn').classList.remove('tp-on');
    if (tpRaf) { cancelAnimationFrame(tpRaf); tpRaf = null; }
  }

  function resetScroll() {
    stopScroll();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function onSpeedChange(val) {
    tpSpeed = parseInt(val);
    document.getElementById('tp-speed-val').textContent = val;
  }

  function onSizeChange(val) {
    document.getElementById('prose-output').style.fontSize = val + 'px';
    document.getElementById('tp-size-val').textContent = val + 'px';
  }

  function onWidthChange(val) {
    document.querySelector('.viewer-inner').style.maxWidth = val + '%';
    document.getElementById('tp-width-val').textContent = val + '%';
  }

  // ── File / Tab state ──────────────────────────────────────────────────────
  const fileStore = [];   // [{ name, content }]
  let activeIdx = -1;

  function isMarkdownFile(file) {
    return /\.(md|markdown)$/i.test(file.name);
  }

  function loadFiles(fileList) {
    const all = Array.from(fileList);
    const arr = all.filter(isMarkdownFile);
    const rejected = all.length - arr.length;
    if (!arr.length) {
      if (rejected > 0) flashDropError();
      return;
    }
    let done = 0;
    arr.forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        fileStore.push({ name: file.name, content: e.target.result });
        finishOne();
      };
      reader.onerror = finishOne;
      reader.readAsText(file);
    });
    function finishOne() {
      done++;
      if (done === arr.length) {
        switchTo(fileStore.length - 1);
        renderTabBar();
        showViewer();
      }
    }
  }

  function flashDropError() {
    // Briefly signal that non-markdown files were ignored
    const label = document.querySelector('.dz-hint');
    if (!label) return;
    const original = label.textContent;
    label.textContent = 'Only .md and .markdown files are accepted';
    label.style.color = '#e5484d';
    setTimeout(() => { label.textContent = original; label.style.color = ''; }, 2200);
  }

  function switchTo(idx) {
    activeIdx = idx;
    const f = fileStore[idx];
    document.getElementById('prose-output').innerHTML = parseMarkdown(f.content);
    document.getElementById('header-filename').textContent = '📄 ' + f.name;
    window.scrollTo(0, 0);
    resetScroll();
    renderTabBar();
  }

  function closeTab(idx, e) {
    e.stopPropagation();
    fileStore.splice(idx, 1);
    if (fileStore.length === 0) {
      goBack();
      return;
    }
    const next = Math.min(idx, fileStore.length - 1);
    switchTo(next);
  }

  let dragSrcIdx = -1;

  function renderTabBar() {
    const bar = document.getElementById('tab-bar');
    bar.innerHTML = '';

    fileStore.forEach((f, i) => {
      const tab = document.createElement('div');
      tab.className = 'file-tab' + (i === activeIdx ? ' active' : '');
      tab.title = f.name;
      tab.draggable = true;
      tab.dataset.idx = i;

      // Click to switch (but not if we just dragged)
      tab.onclick = () => { if (!tab._wasDragged) switchTo(i); tab._wasDragged = false; };

      // Drag events
      tab.addEventListener('dragstart', e => {
        dragSrcIdx = i;
        tab.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', 'tab'); // mark as tab drag
      });
      tab.addEventListener('dragend', () => {
        tab.classList.remove('dragging');
        bar.querySelectorAll('.file-tab').forEach(t => t.classList.remove('drag-over'));
        dragSrcIdx = -1;
      });
      tab.addEventListener('dragover', e => {
        if (dragSrcIdx === -1 || dragSrcIdx === i) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        bar.querySelectorAll('.file-tab').forEach(t => t.classList.remove('drag-over'));
        tab.classList.add('drag-over');
      });
      tab.addEventListener('dragleave', () => tab.classList.remove('drag-over'));
      tab.addEventListener('drop', e => {
        // File drop (not a tab reorder): let it bubble to the bar-level handler.
        if (dragSrcIdx === -1) { tab.classList.remove('drag-over'); return; }
        e.preventDefault();
        e.stopPropagation();
        tab.classList.remove('drag-over');
        if (dragSrcIdx === i) return;
        tab._wasDragged = true;
        // Reorder fileStore
        const moved = fileStore.splice(dragSrcIdx, 1)[0];
        const dest = dragSrcIdx < i ? i - 1 : i; // adjust for removed element if needed
        fileStore.splice(dest, 0, moved);
        // Keep active tab tracked correctly
        if (activeIdx === dragSrcIdx) {
          activeIdx = dest;
        } else if (dragSrcIdx < activeIdx && dest >= activeIdx) {
          activeIdx--;
        } else if (dragSrcIdx > activeIdx && dest <= activeIdx) {
          activeIdx++;
        }
        renderTabBar();
      });

      const name = document.createElement('span');
      name.className = 'file-tab-name';
      name.textContent = f.name;

      const close = document.createElement('button');
      close.className = 'file-tab-close';
      close.innerHTML = '&times;';
      close.title = 'Close';
      close.onclick = ev => closeTab(i, ev);

      tab.appendChild(name);
      tab.appendChild(close);
      bar.appendChild(tab);
    });

    // + add button
    const addBtn = document.createElement('button');
    addBtn.className = 'tab-add-btn';
    addBtn.title = 'Add files — or drop them anywhere on this bar';
    addBtn.textContent = '+';
    addBtn.onclick = () => { document.getElementById('file-input').value = ''; document.getElementById('file-input').click(); };
    bar.appendChild(addBtn);

    // Collapse toggle button — pinned right
    const colBtn = document.createElement('button');
    colBtn.className = 'tab-collapse-btn';
    colBtn.title = 'Collapse tab bar';
    colBtn.innerHTML = `<svg width="14" height="8" viewBox="0 0 14 8" fill="none"><path d="M1 7l6-6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    colBtn.onclick = toggleTabBar;
    bar.appendChild(colBtn);

    document.getElementById('tab-bar-wrap').classList.add('visible');

    // Scroll active tab into view
    const activeTab = bar.querySelector('.file-tab.active');
    if (activeTab) activeTab.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  function toggleTabBar() {
    document.getElementById('tab-bar-wrap').classList.toggle('collapsed');
  }

  function showViewer() {
    document.getElementById('picker').style.display = 'none';
    document.getElementById('viewer').classList.add('active');
    document.getElementById('back-btn').style.display = 'flex';
    document.getElementById('tp-toggle-btn').classList.add('visible');
    document.getElementById('tp-header-play-btn').style.display = 'flex';
  }

  function goBack() {
    stopScroll();
    tpActive = false;
    fileStore.length = 0;
    activeIdx = -1;
    const wrap = document.getElementById('tab-bar-wrap');
    wrap.classList.remove('visible', 'collapsed');
    document.getElementById('tab-bar').innerHTML = '';
    document.getElementById('teleprompter-bar').classList.remove('visible');
    document.getElementById('tp-toggle-btn').classList.remove('visible', 'tp-on');
    document.getElementById('viewer').classList.remove('active');
    document.getElementById('picker').style.display = '';
    document.getElementById('back-btn').style.display = 'none';
    document.getElementById('tp-header-play-btn').style.display = 'none';
    document.getElementById('tp-header-play-icon').textContent = '▶';
    document.getElementById('header-filename').textContent = '';
    document.getElementById('file-input').value = '';
    // Reset controls
    document.getElementById('prose-output').style.fontSize = '';
    document.getElementById('tp-size-slider').value = 16;
    document.getElementById('tp-size-val').textContent = '16px';
    document.querySelector('.viewer-inner').style.maxWidth = '';
    document.getElementById('tp-width-slider').value = 95;
    document.getElementById('tp-width-val').textContent = '95%';
  }

  document.getElementById('file-input').addEventListener('change', e => {
    loadFiles(e.target.files);
  });

  // Spacebar play/pause — only when viewer is active, ignore if focus is on an input
  document.addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    if (['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName)) return;
    if (!document.getElementById('viewer').classList.contains('active')) return;
    e.preventDefault();
    togglePlay();
  });

  // Drag events on both drop zones — ignore tab reorder drags
  function setupDrop(el) {
    el.addEventListener('dragover', e => {
      if (dragSrcIdx !== -1) return; // tab drag in progress
      e.preventDefault(); el.classList.add('dragover');
    });
    el.addEventListener('dragleave', () => el.classList.remove('dragover'));
    el.addEventListener('drop', e => {
      if (dragSrcIdx !== -1) return; // tab drag — let tab handler deal with it
      e.preventDefault(); el.classList.remove('dragover'); loadFiles(e.dataTransfer.files);
    });
  }
  setupDrop(document.getElementById('drop-zone-pro'));

  // Tab bar (and collapsed strip) accept file drops anywhere, with highlight.
  // A depth counter prevents flicker as the cursor passes over child tabs/buttons.
  function setupBarDrop(el) {
    let depth = 0;
    el.addEventListener('dragenter', e => {
      if (dragSrcIdx !== -1) return;      // tab reorder in progress, not a file drop
      if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes('Files')) return;
      depth++;
      el.classList.add('file-dragover');
    });
    el.addEventListener('dragover', e => {
      if (dragSrcIdx !== -1) return;
      if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes('Files')) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });
    el.addEventListener('dragleave', () => {
      if (dragSrcIdx !== -1) return;
      depth = Math.max(0, depth - 1);
      if (depth === 0) el.classList.remove('file-dragover');
    });
    el.addEventListener('drop', e => {
      if (dragSrcIdx !== -1) return;      // tab reorder handles its own drop
      if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes('Files')) return;
      e.preventDefault();
      e.stopPropagation();
      depth = 0;
      el.classList.remove('file-dragover');
      loadFiles(e.dataTransfer.files);
    });
  }
  setupBarDrop(document.getElementById('tab-bar'));
  setupBarDrop(document.getElementById('tab-collapsed-strip'));

</script>
</body>
</html>
